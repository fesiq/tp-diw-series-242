<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trabalho Prático - DIW - Séries - Principal</title>
  <link rel="stylesheet" href="assets/css/styles.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
</head>

<body class="bg-dark text-white">
  <!-- Cabeçalho com logo e menu do site  -->
  <header>
    <a href="./index.html"><img alt="Logotipo" src="./assets/img/logo.png"></a>
    <nav>
      <a href="./explorer.html">Explorador de Séries</a>
    </nav>
  </header>
  <main>
    <!-- Seção 1 - Cards Series populares -->
    <section>
      <div id="carroselSeries" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-indicators">
          <button type="button" data-bs-target="#carroselSeries" data-bs-slide-to="0" class="active"
            aria-current="true" aria-label="Slide 1"></button>
          <button type="button" data-bs-target="#carroselSeries" data-bs-slide-to="1"
            aria-label="Slide 2"></button>
          <button type="button" data-bs-target="#carroselSeries" data-bs-slide-to="2"
            aria-label="Slide 3"></button>
          <button type="button" data-bs-target="#carroselSeries" data-bs-slide-to="3"
            aria-label="Slide 4"></button>
          <button type="button" data-bs-target="#carroselSeries" data-bs-slide-to="4"
            aria-label="Slide 5"></button>
        </div>
        <div class="carousel-inner" id="popular-series">

        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carroselSeries"
          data-bs-slide="prev">
          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Previous</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carroselSeries"
          data-bs-slide="next">
          <span class="carousel-control-next-icon" aria-hidden="true"></span>
          <span class="visually-hidden">Next</span>
        </button>
      </div>
    </section>

     <section>
      <div class="container my-5">
        <h2 class="mb-4">Séries Recentes</h2>
        <div class="row row-cols-1 row-cols-md-3 g-4" id="new-series">
        </div>
      </div>
      
     </section>
    <!-- Seção 3 - Informações sobre responsável pela criação do site (aluno/aluna)  -->
    <section>
      <div class="container" id="info-autor">
        <h2>Sobre o autor</h2>
        <h4 id="nome-autor">Fernando Siqueira</h3>
        <!-- <img src="" alt="Foto do autor">
        <div id="dados-autor">
          <p id="bio">Estudante de engenharia de software, motivado pela possibilidade de uma vida melhor 🤚</p>
          <a id="email"></a>
          <a id="github" href="https://github.com/fesiq/">GitHub</a>
          <a id="linkedin" href="https://www.linkedin.com/in/fesiq">LinkedIn</a>
        </div> -->
      </div>
    </section>
    <!-- Seção 4 - grupo de cards com informações das sérias favoritas. ORIENTAÇÃO: use componente do bootstrap-->
    <section class="container mt-5">
      <h2 class="text-center mb-4">Séries Favoritas</h2>
      <div class="row" id="favorite-series">
        <!-- Os cards das séries favoritas serão carregados dinamicamente aqui -->
      </div>
    </section>
  </main>

  <footer class="bg-dark text-white py-3 mt-5 text-center">
    <p>&copy; 2024 Portal de Séries por Fernando Siqueira. Todos os direitos reservados.</p>
  </footer>
  <!-- script do autor-->
   <script src="assets/js/config.js"></script>
   <script src="./assets/js/main.js"></script>
  <!-- scripts do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
    crossorigin="anonymous"></script>
</body>

</html>
